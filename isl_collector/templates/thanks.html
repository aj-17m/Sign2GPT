<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#6366f1">
    <title>Thanks for contributing!</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main>
        <div class="thanks-card">
            <h1>🎉 Thanks!</h1>
            <p class="lead">Your video was saved.</p>

            <div class="receipt">
                <div class="receipt-row">
                    <span class="receipt-label">Submission</span>
                    <span class="receipt-value">#{{ submission_id }}</span>
                </div>
                <div class="receipt-row">
                    <span class="receipt-label">Meaning</span>
                    <span class="receipt-value">"{{ english_text }}"</span>
                </div>
                <div class="receipt-row">
                    <span class="receipt-label">File size</span>
                    <span class="receipt-value">{{ filesize_mb }} MB</span>
                </div>
            </div>

            <a href="/" class="btn-primary">Upload Another</a>

            <p class="small">More variety helps the model — try different sentences, topics, and signing styles.</p>
        </div>
    </main>

    <footer>
        <p><a href="/">Back to home</a></p>
    </footer>
</body>
</html>
